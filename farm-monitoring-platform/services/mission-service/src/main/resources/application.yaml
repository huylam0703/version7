server:
  port: 8083
  servlet:
    context-path: /api/v1/mission

management:
  health:
    rabbit:
      enabled: false
farm:
  security:
    enabled: false
spring:
  application:
    name: mission-service
  profiles:
    active: dev

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=farm_mission_db;encrypt=true;trustServerCertificate=true
    username: MSI
    password: 1234

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false


springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha