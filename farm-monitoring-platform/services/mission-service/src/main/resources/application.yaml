server:
  port: 8083
  servlet:
    context-path: /api/v1/mission

management:
  health:
    rabbit:
      enabled: false
farm:
  security:
    enabled: true
spring:
  application:
    name: mission-service
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
#          sau nay dung khi hoan tat service va build tat ca service bang docker: AUTH_JWKS_URI: http://user-auth-service:8080/.well-known/jwks.json


  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=mission_db;encrypt=true;trustServerCertificate=true
    username: MSI
    password: 1234

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false


springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

integration:
  farm-device:
    base-url: ${FARM_DEVICE_BASE_URL:http://localhost:8082}
mission:
  reference-validation:
    mode: ${MISSION_REFERENCE_VALIDATION_MODE:remote}