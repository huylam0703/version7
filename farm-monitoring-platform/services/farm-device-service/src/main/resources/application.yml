server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: farm-device-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:14330};databaseName=${DB_NAME:farm_device_db};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/farm-starter
    baseline-on-migrate: true
    baseline-version: 0

management:
  health:
    rabbit:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false