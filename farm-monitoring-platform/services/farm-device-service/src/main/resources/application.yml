server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: farm-device-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:14330};databaseName=${DB_NAME:farm_device_db};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  flyway:
    enabled: true
    locations: classpath:db/farm-starter,classpath:db/farm-device
    baseline-on-migrate: true
    baseline-version: 0

farm:
  security:
    enabled: ${FARM_SECURITY_ENABLED:true}

management:
  health:
    rabbit:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html