server:
  port: ${SERVER_PORT:8082}

management:
  health:
    rabbit:
      enabled: false

spring:
  application:
    name: farm-device-service
  profiles:
    active: dev

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=farm_device_db;encrypt=true;trustServerCertificate=true
    username: MSI
    password: 1234

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false
  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false