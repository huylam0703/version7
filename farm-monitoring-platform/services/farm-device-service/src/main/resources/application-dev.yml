spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

farm:
  security:
    enabled: ${FARM_SECURITY_ENABLED:true}
    dev-user-id: 00000000-0000-0000-0000-000000000001

logging:
  level:
    org.hibernate.SQL: debug
springdoc:
  api-docs:
    enabled: true
    path: /openapi.json
  swagger-ui:
    enabled: true
    path: /swagger