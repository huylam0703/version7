server:
  port: 8085
  servlet:
    context-path: /api/v1/alert

spring:
  application:
    name: alert-service

  datasource:
    url: jdbc:sqlserver://localhost:14330;databaseName=alert_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${MSSQL_SA_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: false

management:
  health:
    rabbit:
      enabled: false
farm:
  security:
    enabled: false