server:
  port: 8085
  servlet:
    context-path: /api/v1/alert

spring:
  application:
    name: alert-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  datasource:
    url: jdbc:sqlserver://localhost:14330;databaseName=alert_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${MSSQL_SA_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: false

management:
  health:
    rabbit:
      enabled: false
farm:
  security:
    enabled: true

  alert:
    sensor:
      thresholds:
        AIR_TEMP:
          min: 10.0
          max: 35.0
        AIR_HUMIDITY:
          min: 30.0
          max: 85.0
        SOIL_MOISTURE:
          min: 20.0
          max: 80.0

      type-mappings:
        "f1d7a0a9-11b3-4f56-a63b-31ad99a19f22": AIR_TEMP