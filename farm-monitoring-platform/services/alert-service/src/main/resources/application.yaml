spring:
  application:
    name: alert-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:farm_alert_db};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:MSI}
    password: ${DB_PASSWORD}

server:
  port: ${SERVER_PORT:8084}