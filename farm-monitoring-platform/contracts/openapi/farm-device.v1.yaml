openapi: 3.0.3
info: { title: Farm Device API, version: 1.0.0 }
paths:
  /api/v1/farms:
    post:
      tags: [Farms]
      operationId: createFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFarmRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmDto' }
  /api/v1/farms/{farmId}:
    get:
      tags: [Farms]
      operationId: getFarm
      parameters:
        - { name: farmId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmDto' }
components:
  schemas:
    CreateFarmRequest:
      type: object
      required: [name]
      properties:
        name:            { type: string, minLength: 1, maxLength: 150 }
        address:         { type: string, maxLength: 255 }
        centerLat:       { type: number, format: double, minimum: -90,  maximum: 90 }
        centerLng:       { type: number, format: double, minimum: -180, maximum: 180 }
        areaHa:          { type: number, format: double, minimum: 0 }
        boundaryGeojson: { type: string }
        description:     { type: string }
    FarmDto:
      type: object
      required: [farmId, name, status, createdBy, createdAt, updatedAt]
      properties:
        farmId:          { type: string, format: uuid }
        name:            { type: string }
        address:         { type: string }
        centerLat:       { type: number, format: double }
        centerLng:       { type: number, format: double }
        areaHa:          { type: number, format: double }
        boundaryGeojson: { type: string }
        description:     { type: string }
        status:          { type: string, enum: [ACTIVE, INACTIVE] }
        createdBy:       { type: string, format: uuid }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: string, format: date-time }