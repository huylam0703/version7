[platformio]
src_dir = .
default_envs = node1, node2

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp32-sensor-node.ino.cpp>

[env:node1]
build_flags = -DSENSOR_NODE_NUMBER=1

[env:node2]
build_flags = -DSENSOR_NODE_NUMBER=2
lib_deps =
    adafruit/DHT sensor library @ 1.4.7
    claws/BH1750 @ 1.3.0
